openapi: 3.1.0
info:
  title: API de Interiores
  version: 1.0.0
  description: >-
    API del diseñador de interiores 2D/3D. Todas las rutas de /v1 exigen un token
    de Supabase Auth (Bearer). Todos los errores usan ErrorBody con mensajes en castellano.
servers:
  - url: http://localhost:3001
    description: Desarrollo local
security:
  - bearerAuth: []
paths:
  /health:
    get:
      operationId: getHealth
      summary: Estado del servicio
      security: []
      responses:
        '200':
          description: El servicio responde
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /v1/projects:
    get:
      operationId: listProjects
      summary: Lista los proyectos de la persona, el más reciente primero
      responses:
        '200':
          description: Lista de proyectos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createProject
      summary: Crea un proyecto con su escena vacía
      description: >-
        Si se envía templateId, la API solo recuerda de qué plantilla nació el proyecto (para mostrar su captura);
        la escena de la plantilla la guarda quien crea el proyecto con PUT /v1/projects/{id}/scene.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectBody'
      responses:
        '201':
          description: Proyecto creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectCreated'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /v1/projects/{id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: getProject
      summary: Devuelve el proyecto con su escena
      responses:
        '200':
          description: Proyecto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateProject
      summary: Cambia el nombre o el tipo del proyecto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectBody'
      responses:
        '200':
          description: Proyecto actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      operationId: deleteProject
      summary: Elimina el proyecto y su escena
      responses:
        '204':
          description: Eliminado, sin cuerpo
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/projects/{id}/scene:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    put:
      operationId: saveScene
      summary: Guarda la escena completa (bloqueo optimista por versión)
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SceneEnvelope'
      responses:
        '200':
          description: Escena guardada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SceneSaved'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/TooLarge'
        '422':
          $ref: '#/components/responses/ValidationError'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
  /v1/analyze-room:
    post:
      operationId: analyzeRoom
      summary: Arma el plano visto desde arriba del ambiente de una foto, con los muebles del catálogo en metros
      description: >-
        Recibe la foto en base64 (JSON, sin multipart) y las piezas del catálogo entre las que puede elegir, con sus medidas
        reales. La API las envía a un modelo de visión (Gemini) y devuelve el plano: las medidas del ambiente, desde dónde se
        tomó la foto, sus puertas y ventanas y, por cada mueble reconocido, el id de UNA de esas piezas con su posición en
        metros, hacia dónde mira, si está contra un muro y si está apoyado sobre otro mueble. Las coordenadas tienen el origen en
        la esquina noroeste, x hacia el este y z hacia el sur. Cada persona puede pedir hasta 10 análisis por hora: los pedidos
        inválidos no cuentan; los que llegan al modelo sí, aunque el modelo falle. La foto no se guarda ni se registra.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyzeRoomBody'
      responses:
        '200':
          description: El plano del ambiente con sus muebles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomAnalysis'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/ImageTooLarge'
        '422':
          $ref: '#/components/responses/AnalysisInvalid'
        '429':
          $ref: '#/components/responses/AnalysisLimit'
        '502':
          $ref: '#/components/responses/AnalysisFailed'
        '503':
          $ref: '#/components/responses/AnalysisUnavailable'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    ProjectId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Versión de la escena que la persona tiene cargada
      schema:
        type: integer
        minimum: 1
  responses:
    Unauthorized:
      description: Falta la sesión o venció
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    NotFound:
      description: No existe o no es de esta persona (nunca se responde 403)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    ValidationError:
      description: >-
        Los datos enviados no cumplen el contrato o un límite de la base de datos. Al crear un proyecto, también
        responde 422 con code limite_de_proyectos cuando la persona ya tiene 50.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    Conflict:
      description: La versión enviada ya no es la vigente
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    TooLarge:
      description: La escena supera los 4 MB (en la API o en la base de datos)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    PreconditionRequired:
      description: Falta el encabezado If-Match
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    ImageTooLarge:
      description: La foto supera los 3 MB una vez decodificada (code imagen_demasiado_grande)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    AnalysisInvalid:
      description: >-
        El pedido no cumple el contrato (code datos_invalidos), la foto no se puede leer o no coincide con el formato
        indicado (code imagen_ilegible) o el catálogo no sirve (code catalogo_invalido)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    AnalysisLimit:
      description: La persona ya pidió 10 análisis por hora (code limite_de_analisis)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    AnalysisFailed:
      description: >-
        El proveedor de visión falló, tardó más de 25 segundos o devolvió una respuesta que no sirve, por ejemplo un id
        fuera del catálogo enviado (code analisis_fallido)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    AnalysisUnavailable:
      description: El análisis no está configurado en este servidor, porque falta GEMINI_API_KEY (code analisis_no_disponible)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok
    ProjectKind:
      type: string
      enum: [vivienda, comercio]
    TemplateId:
      type: string
      pattern: '^[a-z0-9-]{1,40}$'
      description: Id de la plantilla de la que nació el proyecto (el mismo patrón que valida la columna template_id)
    ProjectSummary:
      type: object
      required: [id, name, kind, templateId, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind:
          oneOf:
            - $ref: '#/components/schemas/ProjectKind'
            - type: 'null'
        templateId:
          description: null si el proyecto nació en blanco o es anterior a las plantillas
          oneOf:
            - $ref: '#/components/schemas/TemplateId'
            - type: 'null'
        updatedAt: { type: string, format: date-time }
    ProjectCreated:
      type: object
      required: [id, name, kind, templateId, version]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind:
          oneOf:
            - $ref: '#/components/schemas/ProjectKind'
            - type: 'null'
        templateId:
          description: null si el proyecto nació en blanco
          oneOf:
            - $ref: '#/components/schemas/TemplateId'
            - type: 'null'
        version: { type: integer, const: 1 }
    ProjectDetail:
      type: object
      required: [id, name, kind, templateId, updatedAt, scene, version]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind:
          oneOf:
            - $ref: '#/components/schemas/ProjectKind'
            - type: 'null'
        templateId:
          description: null si el proyecto nació en blanco o es anterior a las plantillas
          oneOf:
            - $ref: '#/components/schemas/TemplateId'
            - type: 'null'
        updatedAt: { type: string, format: date-time }
        scene:
          $ref: '#/components/schemas/SceneEnvelope'
        version: { type: integer, minimum: 1 }
    CreateProjectBody:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        kind:
          $ref: '#/components/schemas/ProjectKind'
        templateId:
          $ref: '#/components/schemas/TemplateId'
    UpdateProjectBody:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        kind:
          oneOf:
            - $ref: '#/components/schemas/ProjectKind'
            - type: 'null'
    SceneEnvelope:
      type: object
      required: [schemaVersion, pascal, graph]
      properties:
        schemaVersion: { type: integer, const: 1 }
        pascal:
          type: object
          required: [core]
          properties:
            core: { type: string }
        graph:
          type: object
          description: Grafo de escena de Pascal; la API no interpreta los nodos
          required: [nodes, rootNodeIds]
          additionalProperties: true
          properties:
            nodes: { type: object, additionalProperties: true }
            rootNodeIds: { type: array, items: { type: string } }
            collections: { type: object, additionalProperties: true }
            materials: { type: object, additionalProperties: true }
            installedPlugins: { type: array, items: { type: string } }
    SceneSaved:
      type: object
      required: [version]
      properties:
        version: { type: integer, minimum: 1 }
    ErrorBody:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - no_autenticado
                - no_encontrado
                - datos_invalidos
                - version_desactualizada
                - escena_demasiado_grande
                - limite_de_proyectos
                - falta_if_match
                - error_interno
                - analisis_no_disponible
                - analisis_fallido
                - catalogo_invalido
                - imagen_ilegible
                - imagen_demasiado_grande
                - limite_de_analisis
            message: { type: string }
    AnalyzeRoomBody:
      type: object
      required: [image, mime, catalog]
      properties:
        image:
          type: string
          contentEncoding: base64
          minLength: 1
          maxLength: 4194304
          description: La foto en base64 (sin el prefijo data:), de hasta 3 MB una vez decodificada
        mime:
          type: string
          enum: [image/jpeg, image/png, image/webp]
          description: El formato real de la foto; debe coincidir con los primeros bytes del archivo
        knownWidthM:
          type: number
          exclusiveMinimum: 0
          maximum: 100
          description: Ancho conocido del muro del fondo de la foto (de lado a lado), en metros; ayuda al modelo a calibrar las medidas
        catalog:
          type: array
          minItems: 1
          maxItems: 100
          description: Las piezas entre las que puede elegir el modelo; hasta 64 KB de JSON y con ids únicos
          items:
            $ref: '#/components/schemas/CatalogOption'
    CatalogOption:
      type: object
      additionalProperties: false
      description: >-
        Lo único que el servicio sabe de cada pieza (sin rutas). Las medidas reales son opcionales y sirven de regla para
        estimar el tamaño del ambiente y evitar que los muebles se superpongan. Los textos no pueden llevar dobles corchetes,
        porque el catálogo viaja al modelo entre las etiquetas [[CATALOG_START]] y [[CATALOG_END]].
      required: [id, name, category]
      properties:
        id: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,99}$' }
        name: { type: string, minLength: 1, maxLength: 120 }
        category: { type: string, minLength: 1, maxLength: 60 }
        tags:
          type: array
          maxItems: 10
          items: { type: string, minLength: 1, maxLength: 40 }
        dimensions_m:
          type: array
          minItems: 3
          maxItems: 3
          items: { type: number, exclusiveMinimum: 0, maximum: 20 }
          description: Medidas reales de la pieza en metros, [ancho, alto, fondo]
    RoomSize:
      type: object
      description: El ambiente, un rectángulo medido entre las caras interiores de los muros
      required: [width_m, depth_m]
      properties:
        width_m: { type: number, minimum: 1.5, maximum: 12, description: De oeste a este, en metros }
        depth_m: { type: number, minimum: 1.5, maximum: 12, description: De norte a sur, en metros }
    PhotoCamera:
      type: object
      description: >-
        Desde dónde se tomó la foto: su posición en el plano (dentro del ambiente, en una esquina o hasta 1 m fuera de un muro) y
        el punto del plano al que mira el centro de la foto, que debe ser distinto de la posición. La altura de los ojos es
        siempre 1,5 m.
      required: [x_m, z_m, look_at]
      properties:
        x_m: { type: number, minimum: -1, maximum: 13 }
        z_m: { type: number, minimum: -1, maximum: 13 }
        look_at:
          type: object
          required: [x_m, z_m]
          properties:
            x_m: { type: number, minimum: -1, maximum: 13 }
            z_m: { type: number, minimum: -1, maximum: 13 }
        fov_deg:
          type: number
          minimum: 30
          maximum: 100
          description: Campo de visión vertical de la foto en grados; si falta, 60
    RoomOpening:
      type: object
      description: >-
        Una puerta o una ventana. at_m es la distancia al centro de la abertura medida a lo largo del muro desde su esquina
        izquierda mirando el muro desde dentro del ambiente (muro norte: desde el oeste; sur: desde el este; este: desde el
        norte; oeste: desde el sur).
      required: [type, wall, at_m, width_m]
      properties:
        type: { type: string, enum: [door, window] }
        wall: { type: string, enum: [n, s, e, w] }
        at_m: { type: number, minimum: 0, maximum: 12 }
        width_m: { type: number, minimum: 0.3, maximum: 6 }
    DetectedFurniture:
      type: object
      description: >-
        Un mueble del plano. x_m y z_m son el centro de su huella en metros (origen en la esquina noroeste, x hacia el este, z
        hacia el sur); facing_deg, hacia dónde mira su frente (0 = al sur, giro horario visto desde arriba: 90 = al oeste, 180
        = al norte, 270 = al este); against_wall, el muro contra el que está pegado; on_top_of, el índice (desde 0) de otro mueble
        de la lista sobre el que está apoyado, sin ciclos. El tamaño real sale siempre del catálogo.
      required: [asset_id, x_m, z_m, facing_deg, against_wall, on_top_of, confidence]
      properties:
        asset_id: { type: string, minLength: 1, maxLength: 100, description: El id de una de las piezas del catálogo enviado }
        x_m: { type: number, minimum: -1, maximum: 13 }
        z_m: { type: number, minimum: -1, maximum: 13 }
        facing_deg: { type: number, minimum: -360, maximum: 360 }
        against_wall:
          oneOf:
            - type: string
              enum: [n, s, e, w]
            - type: 'null'
        on_top_of:
          oneOf:
            - type: integer
              minimum: 0
              maximum: 99
            - type: 'null'
        confidence: { type: number, minimum: 0, maximum: 1 }
    RoomAnalysis:
      type: object
      description: El plano del ambiente visto desde arriba, en el orden en que el modelo lo razona
      required: [room, camera, openings, furniture, warnings]
      properties:
        room:
          $ref: '#/components/schemas/RoomSize'
        camera:
          $ref: '#/components/schemas/PhotoCamera'
        openings:
          type: array
          maxItems: 30
          items:
            $ref: '#/components/schemas/RoomOpening'
        furniture:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/DetectedFurniture'
        warnings:
          type: array
          items: { type: string }
