name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Supabase local (Docker)
        run: pnpm db:start
      - name: Variables de prueba desde Supabase local
        run: node scripts/local-env.mjs --github-env
      - run: pnpm verify
